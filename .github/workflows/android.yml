name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 交给下一步显式接受；action 内置的 sdkmanager 版本会卡在交互提示。
          accept-android-sdk-licenses: false
          # cmdline-tools 16 已移除旧的 `tools` 包，只让 action 装 platform-tools。
          packages: platform-tools

      - name: Install SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testGameDebugUnitTest

      - name: Decode fixed signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 未配置，无法生成可覆盖安装的签名 APK"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/astroloop-release.p12"
          test -s "$RUNNER_TEMP/astroloop-release.p12"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/astroloop-release.p12"
            printf 'storeType=PKCS12\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APKs
        run: |
          set -euo pipefail
          VERSION_CODE=$((200 + GITHUB_RUN_NUMBER))
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VERSION_NAME="1.5.${GITHUB_RUN_NUMBER}"
          fi
          ./gradlew --no-daemon assembleGameRelease assembleTuningRelease \
            -PversionCodeOverride="$VERSION_CODE" \
            -PversionNameOverride="$VERSION_NAME"

      - name: Verify APK signatures
        env:
          # 公开证书指纹，不是私钥。更换签名密钥时需要同步更新。
          EXPECTED_CERT_SHA256: "73:28:60:15:20:25:62:54:E0:5D:2A:90:94:D6:DD:AA:6F:A2:41:25:54:46:74:BD:B7:6F:A9:E4:0A:CE:B4:E6"
        run: |
          set -euo pipefail
          normalize() { tr -d ':' | tr 'A-F' 'a-f'; }
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | normalize)"
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk" -path '*/build-tools/*/apksigner' -type f | sort -V | tail -1)"
          test -x "$apksigner"
          for apk in app/build/outputs/apk/*/release/*.apk; do
            echo "== $apk"
            actual="$("$apksigner" verify --print-certs "$apk" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | normalize)"
            echo "SHA-256: $actual"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$apk 的签名证书不是固定发布密钥"
              exit 1
            fi
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: astroloop-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            app/build/outputs/apk/game/release/*.apk
            app/build/outputs/apk/tuning/release/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/game/release/*.apk
            app/build/outputs/apk/tuning/release/*.apk
          generate_release_notes: true
